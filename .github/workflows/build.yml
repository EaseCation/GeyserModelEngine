name: Auto Release

on:
  push:
    branches:
      - main

env:
  # EaseCation Yunxiao Maven (net.easecation.* dependencies), repository secrets.
  ORG_GRADLE_PROJECT_yunxiaoMavenUsername: ${{ secrets.YUNXIAO_MAVEN_USERNAME }}
  ORG_GRADLE_PROJECT_yunxiaoMavenPassword: ${{ secrets.YUNXIAO_MAVEN_PASSWORD }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Setup JDK
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'

      # Build
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Auto release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{secrets.GITHUB_TOKEN}}"
          automatic_release_tag: latest
          prerelease: false
          files: |
            paper/build/libs/GeyserModelEngine*.jar
            geyser/build/libs/GeyserModelEngine*.jar
